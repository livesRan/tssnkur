name: Deploy MySQL Bicep
run-name: Deploy MySQL Flexible Server (Bicep)
on:
  workflow_dispatch: # 支持手动触发
  push:
    branches: [ main ]
    paths:
      - 'db-flexible-server.bicep'

permissions:
  contents: read

jobs:
  deploy-bicep:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (Service Principal with creds JSON)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.TSSNKUR_SECRET }}

      - name: List accessible Azure subscriptions
        run: az account list --query "[].id" -o tsv

      - name: Create Resource Group if not exists
        run: |
          az group create \
            --name rg-tssnkur-prod \
            --location "East Asia"

      - name: Deploy Bicep template
        run: |
          az deployment group create \
            --resource-group rg-tssnkur-prod \
            --template-file ./db-flexible-server.bicep
