name: Deploy MySQL Bicep
run-name: Deploy MySQL Flexible Server (Bicep)
on:
  workflow_dispatch: # 手动触发
  push:
    branches: [ main ]
    paths:
      - 'db-flexible-server.bicep'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-bicep:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Force set target subscription
        run: az account set --subscription 3bbc5821-b30f-476a-81c2-795ae462405a

      - name: Deploy Bicep template
        run: |
          az deployment group create \
            --resource-group rg-tssnkur-prod \
            --template-file ./db-flexible-server.bicep
