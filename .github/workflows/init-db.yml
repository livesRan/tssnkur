name: Initialize DB Config
run-name: Run initialize-db-config.sh
on:
  workflow_dispatch: # 手动触发

permissions:
  contents: read

jobs:
  init-db:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login with Service Principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.TSSNKUR_SECRET }}

      - name: List files debug
        run: ls -la

      - name: Add execute permission & Run script
        run: |
          chmod +x ./initialize-db-config.sh
          ./initialize-db-config.sh
