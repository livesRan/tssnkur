name: Initialize DB Config
run-name: Run initialize-db-config.sh
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  init-db:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login OIDC
        uses: azure/login@v2
        with:
          creds: ${{ secrets.TSSNKUR_SECRET }}

      - name: Run initialize db script
        run: |
          sudo apt update && sudo apt install -y dos2unix
          dos2unix ./initialize-db-config.sh
          bash ./initialize-db-config.sh
