name: Initialize DB Config
run-name: Run initialize-db-config.sh
on:
  workflow_dispatch: # 手动触发

permissions:
  id-token: write
  contents: read

jobs:
  init-db:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug list files
        run: |
          ls -la
          ls -la .github/workflows/

      - name: Azure Login OIDC
        uses: azure/login@v2
        with:
          creds: ${{ secrets.TSSNKUR_SECRET }}

      - name: Run script
        run: bash .github/workflows/initialize-db-config.sh
