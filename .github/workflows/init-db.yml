name: Initialize DB Config
run-name: Run initialize-db-config.sh
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  init-db:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug - List root files
        run: ls -la

      - name: Azure Login OIDC
        uses: azure/login@v2
        with:
          creds: ${{ secrets.TSSNKUR_SECRET }}

      # 改用bash直接读取文件，绕过executable权限/换行符问题
      - name: Run initialize db script
        run: bash ./initialize-db-config.sh
