name: Set DB Maintenance Window
run-name: Run set-maintenance-window.sh
on:
  workflow_dispatch: # 手动触发

permissions:
  id-token: write
  contents: read

jobs:
  set-maintenance:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Add execute permission
        run: chmod +x ./set-maintenance-window.sh

      - name: Run maintenance window script
        run: ./set-maintenance-window.sh
